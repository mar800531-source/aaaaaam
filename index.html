<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الكلمات الأسطوري - عمار بن ياسر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --primary-color: #10b981;
            --bg-color: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            --container-bg: rgba(255, 255, 255, 0.08);
            --text-color: #fff;
            --accent-color: #34d399;
            
            /* تكبير أحجام الخطوط والعناصر لتملأ الشاشة بشكل أفضل */
            --fs-xl: clamp(24px, 6vw, 38px);
            --fs-l: clamp(22px, 5vw, 32px);
            --fs-m: clamp(18px, 4.5vw, 24px);
            --fs-s: clamp(15px, 3.5vw, 18px);
            
            --btn-size: clamp(50px, 14vw, 75px);   /* تكبير الأزرار */
            --slot-size: clamp(45px, 13vw, 65px);  /* تكبير مربعات الحروف */
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), #059669);
            filter: blur(150px);
            opacity: 0.3;
            z-index: 0;
        }

        .watermark-multi {
            position: absolute;
            font-size: 5vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 1;
        }
        .wm-1 { top: 10%; left: 15%; transform: rotate(-15deg); }
        .wm-2 { top: 80%; right: 10%; transform: rotate(10deg); }
        .wm-3 { bottom: 10%; left: 18%; transform: rotate(20deg); }
        .wm-4 { top: 40%; right: 5%; }

        /* زيادة عرض الحاوية لتأخذ مساحة أكبر من الشاشة */
        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6vw 5vw;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            width: 96vw;     /* عرض أكبر للشاشة */
            max-width: 550px; /* زيادة الحد الأقصى للعرض ليكون الحجم كبير ومريح */
            max-height: 96vh;
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .main-title {
            font-size: var(--fs-xl);
            font-weight: 900;
            background: linear-gradient(135deg, #34d399, #6ee7b7, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1vh;
        }

        .sub-title {
            color: #94a3b8;
            font-size: var(--fs-s);
            font-weight: 700;
            margin-bottom: 2.5vh;
        }

        .clue-box {
            font-size: var(--fs-m);
            margin-bottom: 2.5vh;
            color: #f8fafc;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            padding: 2vh 4vw;
            border-radius: 15px;
            border-right: 5px solid #10b981;
            text-align: right;
        }

        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 2.5vw;
            margin-bottom: 3vh;
            min-height: 7vh;
            flex-wrap: wrap;
        }

        .slot {
            width: var(--slot-size);
            height: var(--slot-size);
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--fs-l);
            font-weight: bold;
            color: #34d399;
            cursor: pointer;
        }

        .slot.filled {
            border: 2px solid #34d399;
            background: rgba(16, 185, 129, 0.3);
        }

        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3.5vw;
            margin-bottom: 3vh;
        }

        .letter-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            flex-basis: calc(18% - 3.5vw);
            max-width: 70px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            font-size: var(--fs-l);
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-btn:active {
            transform: scale(0.9);
        }

        .letter-btn.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 4vw;
            margin-top: auto;
            padding-top: 1vh;
        }

        .action-btn {
            flex: 1;
            padding: 1.8vh;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: var(--fs-m);
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .btn-submit {
            background: #10b981;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .message {
            font-size: var(--fs-m);
            margin-top: 1.5vh;
            font-weight: bold;
            min-height: 3.5vh;
        }

        .footer {
            margin-top: 2vh;
            font-size: 3.5vw;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1.5vh;
        }
        .footer strong {
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="watermark-multi wm-1">عمار بن ياسر</div>
    <div class="watermark-multi wm-2">عمار أصلاوي</div>
    <div class="watermark-multi wm-3">⭐</div>
    <div class="watermark-multi wm-4">🧠</div>

    <div class="game-container">
        <div class="main-title">تحدي الكلمات</div>
        <div class="sub-title">فكر، اجمع الحروف، وحل اللغز</div>

        <div class="clue-box" id="clueText">جاري تحميل اللغز...</div>

        <div class="answer-slots" id="answerSlots"></div>
        <div class="letters-grid" id="lettersGrid"></div>

        <div class="controls">
            <button class="action-btn btn-clear" onclick="clearSelection()">مسح 🔄</button>
            <button class="action-btn btn-submit" onclick="checkWord()">تحقق ✅</button>
        </div>

        <div class="message" id="messageText"></div>

        <div class="footer">
            تصميم وتطوير: <strong>عمار أصلاوي</strong>
        </div>
    </div>

    <script>
        const levels = [
            { clue: "حيوان يُسمى سفينة الصحراء؟", word: "جمل", scrambled: "لمج" },
            { clue: "عاصمة دولة اليابان؟", word: "طوكيو", scrambled: "يوتكو" },
            { clue: "أكبر كوكب في المجموعة الشمسية؟", word: "المشتري", scrambled: "ريتمشال" },
            { clue: "عنصر كيميائي رمزه O؟", word: "أكسجين", scrambled: "نيجكسأ" },
            { clue: "جهاز ألعاب من شركة سوني؟", word: "بلايستيشن", scrambled: "يشيلاستيبن" }
        ];

        let currentLevel = parseInt(localStorage.getItem("mesh_level")) || 0;
        let selectedLetters = [];

        function initLevel() {
            if (currentLevel >= levels.length) {
                document.querySelector(".game-container").innerHTML = `
                    <div class="main-title" style="font-size: 8vw;">عمار بن ياسر</div>
                    <h1 style="color:#34d399; font-size:7vw; margin:2vh 0;">🏆 أسطورة الكلمات!</h1>
                    <p style="color:#cbd5e1; font-size:4.5vw; margin-bottom:3vh;">أتممت جميع مراحل تحدي الكلمات بنجاح!</p>
                    <button class="action-btn btn-submit" onclick="resetGame()" style="width:100%; padding:2vh;">إعادة اللعب من جديد 🔄</button>
                    <div class="footer" style="margin-top:3vh;">تصميم وتطوير: <strong>عمار أصلاوي</strong></div>
                `;
                return;
            }

            const data = levels[currentLevel];
            document.getElementById("clueText").innerText = `لغز (${currentLevel + 1}/${levels.length}): ${data.clue}`;
            selectedLetters = [];
            document.getElementById("messageText").innerText = "";

            renderSlots();
            renderLetters();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById("answerSlots");
            slotsContainer.innerHTML = "";
            const wordLength = levels[currentLevel].word.length;

            for (let i = 0; i < wordLength; i++) {
                const slot = document.createElement("div");
                slot.className = "slot" + (selectedLetters[i] ? " filled" : "");
                slot.innerText = selectedLetters[i] || "";
                
                slot.onclick = () => {
                    if(selectedLetters[i]) {
                        selectedLetters.splice(i, 1);
                        renderSlots();
                        renderLetters();
                    }
                };
                slotsContainer.appendChild(slot);
            }
        }

        function renderLetters() {
            const gridContainer = document.getElementById("lettersGrid");
            gridContainer.innerHTML = "";
            const scrambled = levels[currentLevel].scrambled;

            scrambled.split("").forEach((char) => {
                const btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = char;
                
                btn.onclick = () => {
                    const wordLength = levels[currentLevel].word.length;
                    if (selectedLetters.length < wordLength) {
                        selectedLetters.push(char);
                        btn.classList.add('used');
                        renderSlots();
                    }
                };
                gridContainer.appendChild(btn);
            });
        }

        function clearSelection() {
            selectedLetters = [];
            document.querySelectorAll('.letter-btn').forEach(btn => {
                btn.classList.remove('used');
            });
            renderSlots();
        }

        function checkWord() {
            const data = levels[currentLevel];
            const formedWord = selectedLetters.join("");
            const msg = document.getElementById("messageText");

            if (formedWord === data.word) {
                msg.style.color = "#34d399";
                msg.innerText = "🎉 إجابة صحيحة!";
                currentLevel++;
                localStorage.setItem("mesh_level", currentLevel);
                setTimeout(initLevel, 1500);
            } else {
                msg.style.color = "#fca5a5";
                msg.innerText = "❌ خطأ، حاول مرة أخرى!";
                setTimeout(clearSelection, 800);
            }
        }

        function resetGame() {
            localStorage.removeItem("mesh_level");
            currentLevel = 0;
            location.reload();
        }

        initLevel();
    </script>
</body>
</html>
