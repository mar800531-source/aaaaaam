<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي العقول الخارق - عمار بن ياسر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e1b4b, #0f172a, #020617);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة تفاعلية */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            filter: blur(120px);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.4;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(-50px, -50px) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* العلامة المائية الفخمة في الخلفية */
        .watermark {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 32px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 1;
            letter-spacing: 4px;
            user-select: none;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* رأس الشاشة والاسم الكبير */
        .header-box {
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            margin-bottom: 5px;
        }

        .sub-title {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* شريط المعلومات (المرحلة + النقاط) */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .stat-badge {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: bold;
            color: #fde047;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05);
        }

        /* صندوق السؤال المثير */
        .question-box {
            font-size: 20px;
            margin-bottom: 25px;
            color: #f8fafc;
            font-weight: 700;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            border-right: 4px solid #38bdf8;
        }

        /* خيارات الأزرار المتحركة والجذابة */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(29, 78, 216, 0.4);
            position: relative;
            overflow: hidden;
        }

        .option-btn::after {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .option-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.6);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }

        .option-btn:active {
            transform: translateY(1px);
        }

        .message {
            font-size: 16px;
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .footer strong {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="watermark">عمار بن ياسر</div>

    <div class="game-container">
        <!-- رأس الشاشة باسم عمار بن ياسر الفخم -->
        <div class="header-box">
            <div class="main-title">عمار بن ياسر</div>
            <div class="sub-title">⚡ تحدي العقول الأسطوري ⚡</div>
        </div>

        <!-- معلومات المرحلة والنقاط -->
        <div class="stats-bar">
            <div class="stat-badge" id="stageIndicator">المرحلة: 1</div>
            <div class="stat-badge" id="scoreIndicator">النقاط: 0 ⭐</div>
        </div>

        <div class="question-box" id="questionText">جاري تشغيل اللعبة...</div>

        <div class="options-container" id="optionsBox"></div>

        <div class="message" id="messageText"></div>

        <div class="footer">
            تصميم وتطوير: <strong>عمار أصلاوي</strong>
        </div>
    </div>

    <script>
        // قاعدة بيانات الأسئلة
        const stages = [
            {
                q: "ما هي عاصمة دولة اليابان؟",
                options: ["طوكيو", "سيول", "بكين", "أنقرة"],
                answer: 0
            },
            {
                q: "أكبر كوكب في المجموعة الشمسية هو؟",
                options: ["المريخ", "المشتري", "زحل", "الزهرة"],
                answer: 1
            },
            {
                q: "كم عدد سور القرآن الكريم؟",
                options: ["112", "114", "120", "108"],
                answer: 1
            },
            {
                q: "ما هو العنصر الكيميائي الذي يرمز له بالرمز (O)؟",
                options: ["الذهب", "الحديد", "الأكسجين", "الفضة"],
                answer: 2
            },
            {
                q: "في أي قارة تقع دولة مصر؟",
                options: ["آسيا", "أوروبا", "أفريقيا", "أستراليا"],
                answer: 2
            },
            {
                q: "ما هو الحيوان الذي يُسمى بـ (سفين الصحراء)؟",
                options: ["الحصان", "الفيل", "الجمل", "الأسد"],
                answer: 2
            },
            {
                q: "كم عظمة في جسم الإنسان البالغ تقريبا؟",
                options: ["206", "300", "180", "250"],
                answer: 0
            }
        ];

        // استرجاع التقدم المحفوظ تلقائياً من ذاكرة الهاتف
        let currentStage = parseInt(localStorage.getItem("game_stage")) || 0;
        let score = parseInt(localStorage.getItem("game_score")) || 0;

        function loadStage() {
            if (currentStage >= stages.length) {
                document.querySelector(".game-container").innerHTML = `
                    <div class="main-title" style="font-size: 32px; margin-bottom: 15px;">عمار بن ياسر</div>
                    <h1 style="color:#4ade80; font-size:26px; margin:15px 0;">🏆 أسطورة العصور!</h1>
                    <p style="color:#cbd5e1; font-size:18px; margin-bottom:20px;">أتممت جميع المراحل بجدارة واقتدار!</p>
                    <div style="background: rgba(253, 224, 71, 0.1); border: 1px dashed #fde047; padding: 15px; border-radius: 12px; font-size: 20px; color: #fde047; font-weight: bold; margin-bottom: 20px;">
                        مجموع نقاطك النهائية: ${score} ⭐
                    </div>
                    <button class="option-btn" onclick="resetGame()">إعادة اللعب من جديد  🔄</button>
                    <div class="footer" style="margin-top: 25px;">تصميم وتطوير: <strong>عمار أصلاوي</strong></div>
                `;
                return;
            }

            const stage = stages[currentStage];
            document.getElementById("stageIndicator").innerText = `المرحلة: ${currentStage + 1}`;
            document.getElementById("scoreIndicator").innerText = `النقاط: ${score} ⭐`;
            document.getElementById("questionText").innerText = stage.q;

            const optionsBox = document.getElementById("optionsBox");
            optionsBox.innerHTML = "";
            document.getElementById("messageText").innerText = "";

            stage.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, stage.answer, btn);
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, correctIndex, btnElement) {
            const msg = document.getElementById("messageText");

            const allBtns = document.querySelectorAll(".option-btn");
            allBtns.forEach(b => b.disabled = true);

            if (selectedIndex === correctIndex) {
                btnElement.style.background = "linear-gradient(135deg, #16a34a, #15803d)";
                msg.style.color = "#4ade80";
                msg.innerText = "✨ إجابة عبقرية! أحسنت.";
                currentStage++;
                score += 10;

                localStorage.setItem("game_stage", currentStage);
                localStorage.setItem("game_score", score);

                setTimeout(loadStage, 1100);
            } else {
                btnElement.style.background = "linear-gradient(135deg, #dc2626, #b91c1c)";
                allBtns[correctIndex].style.background = "linear-gradient(135deg, #16a34a, #15803d)";
                msg.style.color = "#f87171";
                msg.innerText = "❌ إجابة خاطئة، لا تقلق حاول في المرحلة القادمة!";

                currentStage++;
                localStorage.setItem("game_stage", currentStage);

                setTimeout(loadStage, 1800);
            }
        }

        function resetGame() {
            localStorage.clear();
            currentStage = 0;
            score = 0;
            location.reload();
        }

        loadStage();
    </script>

</body>
</html>
