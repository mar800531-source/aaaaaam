<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الكلمات الأسطوري - عمار بن ياسر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #10b981, #059669);
            filter: blur(140px);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.3;
        }

        /* رسومات خلفية صغيرة وزخارف */
        .sparkle {
            position: absolute;
            color: rgba(52, 211, 153, 0.25);
            font-size: 20px;
            animation: pulseSparkle 3s infinite alternate;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes pulseSparkle {
            0% { transform: scale(0.8); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        .watermark {
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-size: 24px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 1;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 22px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 420px;
            width: 92%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #34d399, #6ee7b7, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .sub-title {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* رأس الصفحة (عداد النقاط وأزرار المساعدة والتخطي) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .score-badge {
            font-size: 14px;
            font-weight: bold;
            color: #fde047;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tools-group {
            display: flex;
            gap: 6px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .tool-btn:hover {
            background: rgba(52, 211, 153, 0.3);
            border-color: #34d399;
        }

        /* صندوق اللغز الجذاب */
        .clue-box {
            font-size: 16px;
            margin-bottom: 15px;
            color: #f8fafc;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 12px;
            border-right: 4px solid #10b981;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        /* مربعات الإجابة المعبأة بالكامل بلا فراغات */
        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 18px;
            min-height: 45px;
            flex-wrap: wrap;
        }

        .slot {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #34d399;
            cursor: pointer;
        }

        .slot.filled {
            border: 2px solid #34d399;
            background: rgba(16, 185, 129, 0.25);
            animation: popIn 0.2s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        /* شبكة الحروف المبعثرة */
        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .letter-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
            transition: all 0.2s ease;
        }

        .letter-btn:active {
            transform: scale(0.92);
        }

        /* أزرار التحكم السفلي */
        .controls {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-submit {
            background: #10b981;
            color: white;
        }

        .message {
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
            min-height: 20px;
        }

        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }
        .footer strong {
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="watermark">عمار بن ياسر</div>

    <!-- رسومات خلفية صغيرة جميلة وزخارف نجوم -->
    <div class="sparkle" style="top: 10%; right: 15%;">✨</div>
    <div class="sparkle" style="top: 25%5; left: 10%; animation-delay: 1s;">⭐</div>
    <div class="sparkle" style="bottom: 15%; right: 20%; animation-delay: 2s;">🌟</div>
    <div class="sparkle" style="bottom: 20%; left: 15%; animation-delay: 1.5s;">✨</div>

    <div class="game-container">
        <div class="main-title">عمار بن ياسر 🧠</div>
        <div class="sub-title">تحدي الكلمات الأسطوري</div>

        <!-- رأس الصفحة: النقاط وزرا المساعدة والتخطي -->
        <div class="top-bar">
            <div class="score-badge" id="scoreDisplay">⭐ النقاط: 0</div>
            <div class="tools-group">
                <button class="tool-btn" onclick="useHint()" title="كشف حرف بـ 5 نقاط">💡 مساعدة (-5)</button>
                <button class="tool-btn" onclick="skipLevel()" title="تخطي المرحلة">⏭️ تخطي</button>
            </div>
        </div>

        <div class="clue-box" id="clueText">جاري تحميل اللغز...</div>

        <!-- مربعات الإجابة -->
        <div class="answer-slots" id="answerSlots"></div>

        <!-- الحروف المبعثرة -->
        <div class="letters-grid" id="lettersGrid"></div>

        <div class="controls">
            <button class="action-btn btn-clear" onclick="clearSelection()">مسح 🔄</button>
            <button class="action-btn btn-submit" onclick="checkWord()">تحقق ✅</button>
        </div>

        <div class="message" id="messageText"></div>

        <div class="footer">
            تصميم وتطوير: <strong>عمار أصلاوي</strong>
        </div>
    </div>

    <script>
        const levels = [
            { clue: "حيوان يُسمى سفينة الصحراء؟", word: "جمل", scrambled: "لمج" },
            { clue: "عاصمة دولة اليابان؟", word: "طوكيو", scrambled: "يوتكو" },
            { clue: "أكبر كوكب في المجموعة الشمسية؟", word: "المشتري", scrambled: "ريتمشال" },
            { clue: "عنصر كيميائي رمزه O؟", word: "أكسجين", scrambled: "نيجكسأ" }
        ];

        let currentLevel = parseInt(localStorage.getItem("mesh_level")) || 0;
        let score = parseInt(localStorage.getItem("mesh_score")) || 20; // يبدأ بـ 20 نقطة لتتمكن من استخدام المساعدة
        let selectedLetters = [];

        function updateScore(amount) {
            score += amount;
            if (score < 0) score = 0;
            localStorage.setItem("mesh_score", score);
            document.getElementById("scoreDisplay").innerText = `⭐ النقاط: ${score}`;
        }

        function initLevel() {
            updateScore(0);
            if (currentLevel >= levels.length) {
                document.querySelector(".game-container").innerHTML = `
                    <div class="main-title" style="font-size: 26px;">عمار بن ياسر 🏆</div>
                    <h1 style="color:#34d399; font-size:22px; margin:15px 0;">أنت أسطورة الكلمات!</h1>
                    <p style="color:#cbd5e1; font-size:15px; margin-bottom:15px;">أتممت جميع المراحل بنجاح رائع!</p>
                    <div style="background: rgba(253,224,71,0.1); border:1px dashed #fde047; padding:10px; border-radius:10px; color:#fde047; margin-bottom:15px; font-weight:bold;">
                        مجموع نقاطك النهائية: ${score} ⭐
                    </div>
                    <button class="action-btn btn-submit" onclick="resetGame()" style="width:100%; padding:10px;">إعادة اللعب 🔄</button>
                    <div class="footer" style="margin-top: 20px;">تصميم وتطوير: <strong>عمار أصلاوي</strong></div>
                `;
                return;
            }

            const data = levels[currentLevel];
            document.getElementById("clueText").innerText = `لغز (${currentLevel + 1}/${levels.length}): ${data.clue}`;
            selectedLetters = new Array(data.word.length).fill(null);
            document.getElementById("messageText").innerText = "";

            renderSlots();
            renderLetters();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById("answerSlots");
            slotsContainer.innerHTML = "";
            const targetWord = levels[currentLevel].word;

            for (let i = 0; i < targetWord.length; i++) {
                const slot = document.createElement("div");
                slot.className = "slot" + (selectedLetters[i] ? " filled" : "");
                slot.innerText = selectedLetters[i] || "";
                
                // النقر على خانة لإفريغها إذا كانت مملوءة
                slot.onclick = () => {
                    if (selectedLetters[i]) {
                        selectedLetters[i] = null;
                        renderSlots();
                    }
                };
                slotsContainer.appendChild(slot);
            }
        }

        function renderLetters() {
            const gridContainer = document.getElementById("lettersGrid");
            gridContainer.innerHTML = "";
            const scrambled = levels[currentLevel].scrambled;

            scrambled.split("").forEach((char) => {
                const btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = char;
                
                btn.onclick = () => {
                    // وضع الحرف في أول فراغ فارغ
                    const emptyIndex = selectedLetters.indexOf(null);
                    if (emptyIndex !== -1) {
                        selectedLetters[emptyIndex] = char;
                        renderSlots();
                    }
                };
                
                gridContainer.appendChild(btn);
            });
        }

        function clearSelection() {
            selectedLetters = new Array(levels[currentLevel].word.length).fill(null);
            renderSlots();
        }

        // زر المساعدة: كشف حرف مقابل 5 نقاط
        function useHint() {
            if (score < 5) {
                alert("عذراً، لا توجد نقاط كافية لديك (تحتاج 5 نقاط على الأقل)!");
                return;
            }

            const targetWord = levels[currentLevel].word;
            // البحث عن أول مكان فارغ أو خاطئ
            for (let i = 0; i < targetWord.length; i++) {
                if (selectedLetters[i] !== targetWord[i]) {
                    selectedLetters[i] = targetWord[i];
                    updateScore(-5); // خصم 5 نقاط
                    renderSlots();
                    return;
                }
            }
        }

        // زر تخطي المرحلة
        function skipLevel() {
            document.getElementById("messageText").style.color = "#fde047";
            document.getElementById("messageText").innerText = "تم تخطي المرحلة بنجاح!";
            currentLevel++;
            localStorage.setItem("mesh_level", currentLevel);
            setTimeout(initLevel, 1000);
        }

        function checkWord() {
            const targetWord = levels[currentLevel].word;
            const userWord = selectedLetters.join("");
            const msg = document.getElementById("messageText");

            if (userWord === targetWord) {
                msg.style.color = "#34d399";
                msg.innerText = "✨ إجابة صحيحة أسطورية! (+10 نقاط)";
                updateScore(10); // مكافأة 10 نقاط
                currentLevel++;
                localStorage.setItem("mesh_level", currentLevel);
                setTimeout(initLevel, 1200);
            } else {
                msg.style.color = "#f87171";
                msg.innerText = "❌ الحروف غير مرتبة بشكل صحيح!";
            }
        }

        function resetGame() {
            localStorage.clear();
            currentLevel = 0;
            score = 20;
            location.reload();
        }

        initLevel();
    </script>
</body>
</html>
