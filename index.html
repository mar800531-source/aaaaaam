<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>عمار ياسر</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(#6ec6ff 0%,#c9efff 48%,#555 48%,#222 100%);
}

#title{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    font-size:26px;
    font-weight:bold;
    text-shadow:0 3px 5px #000;
    white-space:nowrap;
}

#score{
    position:absolute;
    top:55px;
    right:15px;
    z-index:20;
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}

#coins{
    position:absolute;
    top:85px;
    right:15px;
    z-index:20;
    color:#ffe600;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}

/* السماء والشمس */

#sun{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#fff176;
    top:80px;
    left:12%;
    box-shadow:0 0 40px #fff176;
}

/* الأرض */

#ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:53%;
    background:#333;
    transform:perspective(400px) rotateX(10deg);
    transform-origin:bottom;
}

/* المسارات */

.track{
    position:absolute;
    bottom:-5%;
    width:18%;
    height:65%;
    background:#555;
    border-left:5px solid #aaa;
    border-right:5px solid #aaa;
    transform-origin:bottom;
}

#track1{
    left:23%;
    transform:perspective(500px) rotateX(45deg);
}

#track2{
    left:41%;
    transform:perspective(500px) rotateX(45deg);
}

#track3{
    left:59%;
    transform:perspective(500px) rotateX(45deg);
}

/* خطوط السكة */

.rail{
    position:absolute;
    bottom:0;
    width:8px;
    height:100%;
    background:#ccc;
}

.track .rail:first-child{
    left:15%;
}

.track .rail:last-child{
    right:15%;
}

/* اللاعب */

#player{
    position:absolute;
    z-index:10;
    bottom:16%;
    left:50%;
    width:55px;
    height:85px;
    transform:translateX(-50%);
    transition:left .16s;
}

.head{
    width:35px;
    height:35px;
    background:#f2b27b;
    border-radius:50%;
    margin:auto;
    border:2px solid #222;
}

.body{
    width:42px;
    height:45px;
    background:#1976d2;
    border-radius:12px 12px 5px 5px;
    margin:auto;
}

.leg{
    position:absolute;
    bottom:0;
    width:13px;
    height:27px;
    background:#222;
    border-radius:5px;
}

.leg.left{
    left:9px;
}

.leg.right{
    right:9px;
}

/* القطارات */

.train{
    position:absolute;
    z-index:7;
    width:105px;
    height:155px;
    background:#d32f2f;
    border-radius:12px 12px 4px 4px;
    border:4px solid #222;
    box-shadow:0 8px 15px #000;
}

.train:before{
    content:"";
    position:absolute;
    top:18px;
    left:13px;
    right:13px;
    height:45px;
    background:#90caf9;
    border:4px solid #222;
    border-radius:5px;
}

.train:after{
    content:"";
    position:absolute;
    bottom:13px;
    left:18px;
    width:65px;
    height:18px;
    background:#222;
    border-radius:50%;
}

/* العملات */

.coin{
    position:absolute;
    z-index:8;
    width:32px;
    height:32px;
    border-radius:50%;
    background:#ffd600;
    border:4px solid #ff9800;
    box-shadow:0 0 12px #ffd600;
    text-align:center;
    color:#8a5a00;
    font-weight:bold;
    line-height:25px;
}

/* أزرار الهاتف */

.controls{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    display:flex;
    gap:12px;
}

.btn{
    width:65px;
    height:55px;
    border:0;
    border-radius:15px;
    background:rgba(255,255,255,.8);
    font-size:25px;
    font-weight:bold;
    box-shadow:0 4px 10px #000;
}

.btn:active{
    transform:scale(.9);
}

/* شاشة البداية والنهاية */

#menu{
    position:absolute;
    inset:0;
    z-index:50;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

#menu h1{
    font-size:42px;
    margin-bottom:10px;
    color:#ffd600;
    text-shadow:0 4px 8px #000;
}

#menu p{
    font-size:18px;
    margin-bottom:25px;
}

#start{
    padding:15px 45px;
    border:0;
    border-radius:15px;
    background:#2196f3;
    color:white;
    font-size:22px;
    font-weight:bold;
}

#gameover{
    display:none;
    position:absolute;
    inset:0;
    z-index:60;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    text-align:center;
}

#gameover h2{
    font-size:38px;
    color:#ff5252;
    margin-bottom:15px;
}

#restart{
    margin-top:20px;
    padding:14px 40px;
    border:0;
    border-radius:15px;
    background:#4caf50;
    color:white;
    font-size:21px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="sun"></div>

    <div id="title">🚆 عمار ياسر</div>

    <div id="score">النقاط: 0</div>
    <div id="coins">🪙 0</div>

    <div id="ground"></div>

    <div id="track1" class="track">
        <div class="rail"></div>
        <div class="rail"></div>
    </div>

    <div id="track2" class="track">
        <div class="rail"></div>
        <div class="rail"></div>
    </div>

    <div id="track3" class="track">
        <div class="rail"></div>
        <div class="rail"></div>
    </div>

    <!-- اللاعب -->

    <div id="player">
        <div class="head"></div>
        <div class="body"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
    </div>

    <!-- أزرار الهاتف -->

    <div class="controls">
        <button class="btn" onclick="moveLeft()">⬅️</button>
        <button class="btn" onclick="jump()">⬆️</button>
        <button class="btn" onclick="moveRight()">➡️</button>
    </div>

    <!-- القائمة -->

    <div id="menu">
        <h1>عمار ياسر</h1>
        <p>🏃 اهرب من القطارات واجمع العملات!</p>
        <button id="start" onclick="startGame()">ابدأ اللعب 🎮</button>
    </div>

    <!-- Game Over -->

    <div id="gameover">
        <h2>انتهت اللعبة</h2>
        <div id="finalScore">النقاط: 0</div>
        <button id="restart" onclick="restartGame()">إعادة اللعب 🔄</button>
    </div>

</div>

<script>

/* =========================
   إعداد اللعبة
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");

const menu = document.getElementById("menu");
const gameover = document.getElementById("gameover");
const finalScore = document.getElementById("finalScore");

let playing = false;

let lane = 1;

let score = 0;
let coins = 0;

let speed = 5;

let trains = [];
let coinObjects = [];

let playerJump = 0;
let jumpVelocity = 0;

let lastTime = 0;
let spawnTimer = 0;
let coinTimer = 0;

/* مواقع المسارات */

function laneX(l){

    const width = window.innerWidth;

    if(l === 0)
        return width * 0.32;

    if(l === 1)
        return width * 0.50;

    return width * 0.68;
}

/* تحديث مكان اللاعب */

function updatePlayer(){

    player.style.left = laneX(lane) + "px";
}

/* بداية اللعبة */

function startGame(){

    menu.style.display = "none";

    gameover.style.display = "none";

    playing = true;

    score = 0;
    coins = 0;

    speed = 5;

    lane = 1;

    trains.forEach(x => x.remove());
    coinObjects.forEach(x => x.remove());

    trains = [];
    coinObjects = [];

    updatePlayer();

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}

/* إعادة اللعبة */

function restartGame(){

    startGame();

}

/* الحركة يمين */

function moveRight(){

    if(!playing) return;

    if(lane < 2){

        lane++;

        updatePlayer();

    }

}

/* الحركة يسار */

function moveLeft(){

    if(!playing) return;

    if(lane > 0){

        lane--;

        updatePlayer();

    }

}

/* القفز */

function jump(){

    if(!playing) return;

    if(playerJump === 0){

        jumpVelocity = 15;

    }

}

/* إنشاء قطار */

function createTrain(){

    const train = document.createElement("div");

    train.className = "train";

    const trainLane =
        Math.floor(Math.random() * 3);

    train.dataset.lane = trainLane;

    train.style.left =
        (laneX(trainLane) - 52) + "px";

    train.style.top = "-180px";

    game.appendChild(train);

    trains.push(train);

}

/* إنشاء عملة */

function createCoin(){

    const coin = document.createElement("div");

    coin.className = "coin";

    coin.innerHTML = "★";

    const coinLane =
        Math.floor(Math.random() * 3);

    coin.dataset.lane = coinLane;

    coin.style.left =
        (laneX(coinLane) - 16) + "px";

    coin.style.top = "-50px";

    game.appendChild(coin);

    coinObjects.push(coin);

}

/* كشف الاصطدام */

function collision(a,b){

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    return !(
        r1.right < r2.left ||
        r1.left > r2.right ||
        r1.bottom < r2.top ||
        r1.top > r2.bottom
    );

}

/* نهاية اللعبة */

function endGame(){

    playing = false;

    finalScore.innerHTML =
        "النقاط: " + Math.floor(score) +
        "<br>🪙 العملات: " + coins;

    gameover.style.display = "flex";

}

/* حلقة اللعبة */

function gameLoop(time){

    if(!playing) return;

    const dt =
        Math.min((time-lastTime)/16.67,2);

    lastTime = time;

    /* النقاط */

    score += 0.12 * dt;

    scoreText.innerHTML =
        "النقاط: " + Math.floor(score);

    coinsText.innerHTML =
        "🪙 " + coins;

    /* زيادة السرعة */

    speed += 0.001 * dt;

    /* القفز */

    if(jumpVelocity !== 0 || playerJump > 0){

        playerJump += jumpVelocity * dt;

        jumpVelocity -= 0.8 * dt;

        if(playerJump <= 0){

            playerJump = 0;
            jumpVelocity = 0;

        }

        player.style.bottom =
            (16 + playerJump) + "%";

    }

    /* إنشاء القطارات */

    spawnTimer += dt;

    if(spawnTimer > Math.max(30,75-speed*3)){

        createTrain();

        spawnTimer = 0;

    }

    /* إنشاء العملات */

    coinTimer += dt;

    if(coinTimer > 55){

        createCoin();

        coinTimer = 0;

    }

    /* تحريك القطارات */

    for(let i=trains.length-1;i>=0;i--){

        const t = trains[i];

        let top =
            parseFloat(t.style.top);

        top += speed * dt;

        t.style.top = top + "px";

        /* الاصطدام */

        if(
            Number(t.dataset.lane) === lane &&
            playerJump < 35 &&
            collision(player,t)
        ){

            endGame();

            return;

        }

        /* حذف القطار */

        if(top > window.innerHeight + 200){

            t.remove();

            trains.splice(i,1);

        }

    }

    /* العملات */

    for(let i=coinObjects.length-1;i>=0;i--){

        const c = coinObjects[i];

        let top =
            parseFloat(c.style.top);

        top += speed * dt;

        c.style.top = top + "px";

        c.style.transform =
            "rotateY(" + (time/3) + "deg)";

        if(
            Number(c.dataset.lane) === lane &&
            playerJump < 50 &&
            collision(player,c)
        ){

            coins++;

            score += 10;

            c.remove();

            coinObjects.splice(i,1);

            continue;

        }

        if(top > window.innerHeight + 100){

            c.remove();

            coinObjects.splice(i,1);

        }

    }

    requestAnimationFrame(gameLoop);

}

/* =========================
   التحكم بالسحب
========================= */

let touchStartX = 0;
let touchStartY = 0;

game.addEventListener("touchstart",function(e){

    touchStartX =
        e.changedTouches[0].clientX;

    touchStartY =
        e.changedTouches[0].clientY;

},{passive:true});

game.addEventListener("touchend",function(e){

    if(!playing) return;

    const x =
        e.changedTouches[0].clientX;

    const y =
        e.changedTouches[0].clientY;

    const dx = x-touchStartX;
    const dy = y-touchStartY;

    if(
        Math.abs(dx) < 30 &&
        Math.abs(dy) < 30
    ){

        return;

    }

    if(Math.abs(dx) > Math.abs(dy)){

        if(dx > 0)
            moveRight();
        else
            moveLeft();

    }else{

        if(dy < 0)
            jump();

    }

},{passive:true});

/* لوحة المفاتيح */

document.addEventListener("keydown",function(e){

    if(e.key === "ArrowLeft")
        moveLeft();

    if(e.key === "ArrowRight")
        moveRight();

    if(e.key === "ArrowUp" || e.key === " ")
        jump();

});

/* بدء الوضع */

updatePlayer();

</script>

</body>
    </html>
