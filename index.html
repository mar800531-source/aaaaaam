<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الكلمات الأسطوري - 300 مرحلة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0e4c5b, #115e67, #083344);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            background: rgba(15, 76, 92, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.18);
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 410px;
            width: 95%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .map-icon-btn {
            background: linear-gradient(135deg, #facc15, #ca8a04);
            border: 2px solid #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 18px;
            transition: 0.2s;
        }
        .map-icon-btn:active { transform: scale(0.9); }

        .level-title-badge {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .coins-badge {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fde047;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* صندوق اللغز */
        .puzzle-card {
            background: #fff;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        .puzzle-img-text {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .puzzle-clue-text {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }

        /* لوحة الكلمات */
        .words-board {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            margin-bottom: 12px;
            max-height: 130px;
            overflow-y: auto;
            padding: 4px;
        }

        .word-row {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .letter-cell {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .letter-cell.revealed {
            background: #facc15;
            color: #1e293b;
            border-color: #ca8a04;
        }

        .letter-cell.empty-slot {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        /* عجلة الحروف المبعثرة */
        .wheel-container {
            position: relative;
            width: 100%;
            min-height: 100px;
            margin: 0 auto 12px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wheel-btn {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            color: #0f172a;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: 0.1s;
        }

        .wheel-btn:active {
            background: #38bdf8;
            color: #fff;
            transform: scale(0.92);
        }

        /* أدوات التحكم السفلي */
        .bottom-tools {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .tool-action-btn {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #fff;
            border-radius: 14px;
            padding: 8px 12px;
            color: #0f172a;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            flex: 1;
            justify-content: center;
            transition: 0.2s;
        }

        .hint-btn {
            background: rgba(255, 255, 255, 0.9);
            flex: 1.5;
            font-size: 14px;
            color: #0f766e;
        }

        /* نافذة خريطة المراحل (300 مرحلة) */
        .map-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #093440, #041f26);
            z-index: 10;
            display: none;
            flex-direction: column;
            padding: 15px;
            border-radius: 24px;
        }

        .map-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 8px;
        }

        .map-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 360px;
            padding: 5px;
        }

        .map-level-item {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .map-level-item.unlocked {
            background: rgba(16, 185, 129, 0.25);
            border-color: #34d399;
            color: #34d399;
        }

        .map-level-item.current {
            background: #facc15;
            color: #0f172a;
            border-color: #eab308;
        }

        .map-level-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .msg-alert {
            font-size: 13px;
            font-weight: bold;
            margin-top: 6px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- نافذة الخريطة -->
        <div class="map-modal" id="mapModal">
            <div class="map-modal-header">
                <span style="font-weight: bold; font-size: 15px; color: #facc15;">🗺️ خريطة المراحل (300 مرحلة)</span>
                <button onclick="toggleMap(false)" style="background:#ef4444; border:none; color:#fff; padding:4px 10px; border-radius:6px; cursor:pointer; font-weight:bold;">إغلاق ✕</button>
            </div>
            <div class="map-list" id="mapListContainer"></div>
        </div>

        <!-- الشريط العلوي -->
        <div class="top-bar">
            <button class="map-icon-btn" onclick="toggleMap(true)" title="خريطة المراحل">🗺️</button>
            <div class="level-title-badge" id="levelTitle">مرحلة 1</div>
            <div class="coins-badge"><span id="coinsCount">100</span> 🟡</div>
        </div>

        <!-- صندوق اللغز -->
        <div class="puzzle-card">
            <div class="puzzle-img-text" id="puzzleEmoji">🧠</div>
            <div class="puzzle-clue-text" id="puzzleClue">جاري التحميل...</div>
        </div>

        <!-- لوحة الكلمات -->
        <div class="words-board" id="wordsBoard"></div>

        <!-- الحروف المبعثرة -->
        <div class="wheel-container" id="wheelContainer"></div>

        <!-- الرسائل والتنبيهات -->
        <div class="msg-alert" id="msgAlert"></div>

        <!-- شريط الأدوات السفلي -->
        <div class="bottom-tools">
            <button class="tool-action-btn" onclick="resetCurrentLevel()">🔄 إعادة</button>
            <button class="tool-action-btn hint-btn" onclick="useHint()">💡 تلميح (10 🟡)</button>
            <button class="tool-action-btn" onclick="nextLevelBtn()">⏭️ التالي</button>
        </div>
    </div>

    <script>
        // قاعدة بيانات أساسية ضخمة يتم تدويرها وتوليدها لتغطي 300 مرحلة كاملة
        const baseBank = [
            { emoji: "🧊", clue: "مكعب ثلج ذائب", answer: "ثلج" },
            { emoji: "🎮", clue: "جهاز ألعاب إلكترونية شهير", answer: "بلايستيشن" },
            { emoji: "📦", clue: "صندوق خشبي أثري", answer: "صندوق" },
            { emoji: "🧠", clue: "عضو التفكير والذكاء", answer: "دماغ" },
            { emoji: "📚", clue: "أطلب العلم ولو في...", answer: "الصين" },
            { emoji: "⭐", clue: "رمز النجاح والتألق السماوي", answer: "نجمة" },
            { emoji: "🌊", clue: "مسطح مائي واسع وعميق", answer: "محيط" },
            { emoji: "🚗", clue: "وسيلة نقل برية سريعة ذات إطارات", answer: "سيارة" },
            { emoji: "🌙", clue: "يظهر في السماء ليلاً وينير الظلام", answer: "قمر" },
            { emoji: "🍎", clue: "فاكهة حمراء شهيرة ومفيدة للصحة", answer: "تفاحة" },
            { emoji: "🐪", clue: "حيوان يُسمى سفينة الصحراء", answer: "جمل" },
            { emoji: "🗼", clue: "عاصمة دولة فرنسا الشهيرة", answer: "باريس" },
            { emoji: "🗺️", clue: "رسم توضيحي لسطح الأرض أو جزء منه", answer: "خريطة" },
            { emoji: "🦁", clue: "يُلقب بملك الغابة", answer: "أسد" },
            { emoji: "⚽", clue: "أشهر رياضة جماعية في العالم", answer: "كرة" },
            { emoji: "⏱️", clue: "أداة قياس الوقت والثواني", answer: "ساعة" },
            { emoji: "💻", q: "جهاز حاسوب محمول ذكي", answer: "لابتوب" },
            { emoji: "🌹", clue: "نبات جميل ذو رائحة عطرة", answer: "وردة" },
            { emoji: "✈️", clue: "وسيلة سفر جوية سريعة", answer: "طائرة" },
            { emoji: "💡", clue: "مصدر للإضاءة والاختراعات", answer: "مصباح" }
        ];

        // توليد 300 مرحلة بشكل تلقائي ومنظم لضمان تنوع الألغاز
        const gameLevels = [];
        for (let i = 1; i <= 300; i++) {
            let base = baseBank[(i - 1) % baseBank.length];
            // إضافة رقم المرحلة لتمييز المراحل المتقدمة
            gameLevels.push({
                id: i,
                emoji: base.emoji,
                clue: `[مرحلة ${i}] ${base.clue}`,
                answer: base.answer
            });
        }

        let currentLevelIndex = parseInt(localStorage.getItem("game_lvl_300")) || 0;
        let coins = parseInt(localStorage.getItem("game_coins_300")) || 100;
        let maxUnlocked = parseInt(localStorage.getItem("game_max_300")) || currentLevelIndex;
        let userInput = [];

        function initGame() {
            if (currentLevelIndex >= gameLevels.length) {
                currentLevelIndex = 0;
            }
            const lvl = gameLevels[currentLevelIndex];
            document.getElementById("levelTitle").innerText = `مرحلة ${lvl.id}`;
            document.getElementById("coinsCount").innerText = coins;
            document.getElementById("puzzleEmoji").innerText = lvl.emoji;
            document.getElementById("puzzleClue").innerText = lvl.clue;
            document.getElementById("msgAlert").innerText = "";
            
            userInput = [];
            renderBoard();
            renderWheel();
        }

        function renderBoard() {
            const board = document.getElementById("wordsBoard");
            board.innerHTML = "";
            const targetWord = gameLevels[currentLevelIndex].answer;

            let row = document.createElement("div");
            row.className = "word-row";

            for (let i = 0; i < targetWord.length; i++) {
                let cell = document.createElement("div");
                cell.className = "letter-cell";
                if (userInput[i]) {
                    cell.innerText = userInput[i];
                    cell.classList.add("revealed");
                } else {
                    cell.classList.add("empty-slot");
                    cell.innerText = "";
                }
                row.appendChild(cell);
            }
            board.appendChild(row);
        }

        function renderWheel() {
            const wheel = document.getElementById("wheelContainer");
            wheel.innerHTML = "";
            const targetWord = gameLevels[currentLevelIndex].answer;
            
            let letters = targetWord.split('');
            let extraLetters = ['ب', 'م', 'ر', 'س', 'ل', 'ك', 'د', 'ت', 'ن', 'ي', 'أ', 'ق'];
            for(let i = 0; i < 4; i++) {
                let randomChar = extraLetters[Math.floor(Math.random() * extraLetters.length)];
                letters.push(randomChar);
            }
            // خلط الحروف عشوائياً
            letters.sort(() => Math.random() - 0.5);

            letters.forEach(char => {
                let btn = document.createElement("button");
                btn.className = "wheel-btn";
                btn.innerText = char;
                btn.onclick = () => {
                    const targetWord = gameLevels[currentLevelIndex].answer;
                    if (userInput.length < targetWord.length) {
                        userInput.push(char);
                        renderBoard();
                        checkVictory();
                    }
                };
                wheel.appendChild(btn);
            });
        }

        function checkVictory() {
            const targetWord = gameLevels[currentLevelIndex].answer;
            if (userInput.length === targetWord.length) {
                let formedWord = userInput.join("");
                const msg = document.getElementById("msgAlert");
                if (formedWord === targetWord) {
                    msg.style.color = "#34d399";
                    msg.innerText = "🎉 إجابة صحيحة أسطورية! (+15 نقطة)";
                    coins += 15;
                    localStorage.setItem("game_coins_300", coins);
                    document.getElementById("coinsCount").innerText = coins;

                    currentLevelIndex++;
                    if (currentLevelIndex > maxUnlocked) {
                        maxUnlocked = currentLevelIndex;
                        localStorage.setItem("game_max_300", maxUnlocked);
                    }
                    localStorage.setItem("game_lvl_300", currentLevelIndex);

                    setTimeout(initGame, 1300);
                } else {
                    msg.style.color = "#f87171";
                    msg.innerText = "❌ إجابة خاطئة، حاول مرة أخرى!";
                    setTimeout(resetCurrentLevel, 1000);
                }
            }
        }

        function resetCurrentLevel() {
            userInput = [];
            document.getElementById("msgAlert").innerText = "";
            renderBoard();
        }

        function useHint() {
            if (coins < 10) {
                alert("نقاطك غير كافية للحصول على تلميح!");
                return;
            }
            coins -= 10;
            localStorage.setItem("game_coins_300", coins);
            document.getElementById("coinsCount").innerText = coins;

            const targetWord = gameLevels[currentLevelIndex].answer;
            for (let i = 0; i < targetWord.length; i++) {
                if (!userInput[i]) {
                    userInput[i] = targetWord[i];
                    break;
                }
            }
            renderBoard();
            checkVictory();
        }

        function nextLevelBtn() {
            if (currentLevelIndex < gameLevels.length - 1) {
                currentLevelIndex++;
                localStorage.setItem("game_lvl_300", currentLevelIndex);
                initGame();
            } else {
                alert("لقد وصلت إلى المرحلة النهائية الأخيرة (300)!");
            }
        }

        function toggleMap(show) {
            const modal = document.getElementById("mapModal");
            if (show) {
                modal.style.display = "flex";
                renderMapList();
            } else {
                modal.style.display = "none";
            }
        }

        function renderMapList() {
            const container = document.getElementById("mapListContainer");
            container.innerHTML = "";
            gameLevels.forEach((lvl, idx) => {
                let item = document.createElement("div");
                let statusClass = "";
                let statusText = "🔒 مقفلة";

                if (idx === currentLevelIndex) {
                    statusClass = "current";
                    statusText = "📍 الحالية";
                } else if (idx <= maxUnlocked) {
                    statusClass = "unlocked";
                    statusText = "⭐ مكتملة";
                } else {
                    statusClass = "locked";
                }

                item.className = `map-level-item ${statusClass}`;
                item.innerHTML = `<span>المرحلة ${lvl.id}</span><span>${statusText}</span>`;

                if (idx <= maxUnlocked) {
                    item.onclick = () => {
                        currentLevelIndex = idx;
                        localStorage.setItem("game_lvl_300", currentLevelIndex);
                        toggleMap(false);
                        initGame();
                    };
                }
                container.appendChild(item);
            });
        }

        initGame();
    </script>
</body>
</html>
