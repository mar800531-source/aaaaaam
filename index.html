<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">

<title>هروب عمار ياسر</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:12px;
    left:0;
    right:0;
    z-index:10;
    pointer-events:none;
    color:white;
    text-shadow:0 2px 5px #000;
    font-weight:bold;
}

#name{
    text-align:center;
    font-size:25px;
}

#info{
    margin:8px 15px;
    display:flex;
    justify-content:space-between;
    direction:rtl;
    font-size:18px;
}

#timeBar{
    width:170px;
    height:8px;
    margin:6px auto;
    background:rgba(255,255,255,.3);
    border-radius:10px;
    overflow:hidden;
}

#timeProgress{
    height:100%;
    width:0%;
    background:#ffd54f;
}

#startScreen,
#gameOver{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.70);
    color:white;
    text-align:center;
}

#gameOver{
    display:none;
}

h1{
    color:#ffd54f;
    font-size:42px;
    margin:10px;
    text-shadow:0 4px 10px #000;
}

h2{
    color:#ff5252;
    font-size:36px;
}

p{
    font-size:18px;
}

button{
    border:0;
    border-radius:16px;
    padding:15px 38px;
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    background:#2196f3;
    color:white;
    box-shadow:0 5px 12px rgba(0,0,0,.5);
}

button:active{
    transform:scale(.94);
}

#touchControls{
    position:fixed;
    left:0;
    right:0;
    bottom:18px;
    z-index:20;
    display:flex;
    justify-content:center;
    gap:12px;
    direction:ltr;
}

.touchButton{
    width:64px;
    height:56px;
    padding:0;
    margin:0;
    font-size:26px;
    background:rgba(0,0,0,.45);
    border:2px solid rgba(255,255,255,.7);
}

#soundButton{
    position:fixed;
    left:12px;
    bottom:18px;
    z-index:25;
    width:52px;
    height:52px;
    padding:0;
    margin:0;
    font-size:22px;
    background:rgba(0,0,0,.45);
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}
</style>
</head>

<body>

<div id="loading">جاري تجهيز اللعبة...</div>

<div id="game"></div>

<div id="hud">

    <div id="name">👶 هروب عمار ياسر</div>

    <div id="info">
        <span id="score">النقاط: 0</span>
        <span id="coins">🪙 0</span>
        <span id="clock">☀️ صباح</span>
    </div>

    <div id="timeBar">
        <div id="timeProgress"></div>
    </div>

</div>

<div id="touchControls">
    <button class="touchButton" id="left">⬅️</button>
    <button class="touchButton" id="jump">⬆️</button>
    <button class="touchButton" id="right">➡️</button>
</div>

<button id="soundButton">🔊</button>

<div id="startScreen">

    <h1>هروب عمار ياسر</h1>

    <p>
        👶 ساعد الطفلة على الهروب<br>
        🐕 تفادى الكلاب والقطط والعوائق
    </p>

    <button id="startButton">
        ابدأ اللعب 🎮
    </button>

</div>

<div id="gameOver">

    <h2>انتهت اللعبة</h2>

    <p id="finalText"></p>

    <button id="restartButton">
        إعادة اللعب 🔄
    </button>

</div>

<script type="module">

import * as THREE
from
"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js";

/* =========================================================
   الإعدادات
========================================================= */

const game = document.getElementById("game");

const scoreElement =
    document.getElementById("score");

const coinsElement =
    document.getElementById("coins");

const clockElement =
    document.getElementById("clock");

const timeProgress =
    document.getElementById("timeProgress");

const loading =
    document.getElementById("loading");

const startScreen =
    document.getElementById("startScreen");

const gameOverScreen =
    document.getElementById("gameOver");

const finalText =
    document.getElementById("finalText");

const soundButton =
    document.getElementById("soundButton");

/* =========================================================
   المشهد
========================================================= */

const scene =
    new THREE.Scene();

scene.fog =
    new THREE.Fog(0x87ceeb,30,180);

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        0.1,
        300
    );

camera.position.set(
    0,
    5,
    10
);

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.7)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

game.appendChild(renderer.domElement);

/* =========================================================
   الإضاءة
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0xbfe8ff,
        0x3a2b22,
        1.8
    );

scene.add(ambient);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    -30,
    50,
    30
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

scene.add(sun);

/* =========================================================
   اللاعب
========================================================= */

const player =
    new THREE.Group();

player.position.set(
    0,
    0,
    0
);

scene.add(player);

/* جسم الطفلة */

const skin =
    new THREE.MeshStandardMaterial({
        color:0xf0b080,
        roughness:.8
    });

const shirt =
    new THREE.MeshStandardMaterial({
        color:0xff6688,
        roughness:.8
    });

const pants =
    new THREE.MeshStandardMaterial({
        color:0x4a78d1,
        roughness:.9
    });

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .38,
            24,
            24
        ),
        skin
    );

head.position.y = 1.55;
head.castShadow = true;

player.add(head);

const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .28,
            .55,
            8,
            16
        ),
        shirt
    );

body.position.y = .95;
body.castShadow = true;

player.add(body);

function createLeg(x){

    const leg =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .11,
                .5,
                6,
                10
            ),
            pants
        );

    leg.position.set(
        x,
        .38,
        0
    );

    leg.castShadow = true;

    player.add(leg);

    return leg;
}

const leftLeg =
    createLeg(-.13);

const rightLeg =
    createLeg(.13);

/* =========================================================
   الشارع
========================================================= */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x3c3c3c,
        roughness:1
    });

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            18,
            500
        ),
        roadMaterial
    );

road.rotation.x =
    -Math.PI / 2;

road.position.z = -220;

road.receiveShadow = true;

scene.add(road);

/* أرصفة */

const sidewalkMaterial =
    new THREE.MeshStandardMaterial({
        color:0xb69b7b,
        roughness:1
    });

for(let side of [-1,1]){

    const sidewalk =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4,
                .25,
                500
            ),
            sidewalkMaterial
        );

    sidewalk.position.set(
        side * 11,
        .1,
        -220
    );

    sidewalk.receiveShadow = true;

    scene.add(sidewalk);

}

/* خطوط الطريق */

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

for(let z=10;z>-500;z-=10){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                .02,
                5
            ),
            lineMaterial
        );

    line.position.set(
        0,
        .025,
        z
    );

    scene.add(line);

}

/* =========================================================
   مباني بسيطة بطابع شوارع يمنية
========================================================= */

const buildingMaterials = [

    new THREE.MeshStandardMaterial({
        color:0xc79c6e
    }),

    new THREE.MeshStandardMaterial({
        color:0xb78555
    }),

    new THREE.MeshStandardMaterial({
        color:0xd6b184
    }),

    new THREE.MeshStandardMaterial({
        color:0x9f7652
    })

];

function createBuilding(x,z){

    const width =
        3 + Math.random()*3;

    const height =
        4 + Math.random()*7;

    const depth =
        5 + Math.random()*5;

    const material =
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ];

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

}

/* إنشاء الشوارع والمباني */

for(let z=0;z>-500;z-=15){

    createBuilding(
        -14 - Math.random()*3,
        z
    );

    createBuilding(
        14 + Math.random()*3,
        z - 7
    );

}

/* =========================================================
   الحيوانات
========================================================= */

function createDog(){

    const dog =
        new THREE.Group();

    const fur =
        new THREE.MeshStandardMaterial({
            color:0x70452c,
            roughness:1
        });

    const dark =
        new THREE.MeshStandardMaterial({
            color:0x24170f
        });

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.0,
                .65,
                1.5
            ),
            fur
        );

    body.position.y=.65;

    dog.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .42,
                16,
                16
            ),
            fur
        );

    head.position.set(
        0,
        1.05,
        .78
    );

    dog.add(head);

    const nose =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .11,
                10,
                10
            ),
            dark
        );

    nose.position.set(
        0,
        1.03,
        1.13
    );

    dog.add(nose);

    for(let x of [-.35,.35]){

        for(let z of [-.45,.45]){

            const leg =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .18,
                        .6,
                        .18
                    ),
                    fur
                );

            leg.position.set(
                x,
                .3,
                z
            );

            dog.add(leg);

        }

    }

    dog.traverse(o=>{
        if(o.isMesh)
            o.castShadow=true;
    });

    return dog;

}

function createCat(){

    const cat =
        new THREE.Group();

    const fur =
        new THREE.MeshStandardMaterial({
            color:0x777777
        });

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                16,
                16
            ),
            fur
        );

    body.scale.set(
        1,
        .75,
        1.3
    );

    body.position.y=.45;

    cat.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .3,
                16,
                16
            ),
            fur
        );

    head.position.set(
        0,
        .75,
        .35
    );

    cat.add(head);

    cat.traverse(o=>{
        if(o.isMesh)
            o.castShadow=true;
    });

    return cat;

}

/* =========================================================
   العملات
========================================================= */

function createCoin(){

    const material =
        new THREE.MeshStandardMaterial({
            color:0xffd600,
            metalness:.7,
            roughness:.2
        });

    const coin =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .25,
                .25,
                .08,
                24
            ),
            material
        );

    coin.rotation.x =
        Math.PI/2;

    coin.position.y =
        1.0;

    return coin;

}

/* =========================================================
   العناصر
========================================================= */

const obstacles = [];
const coins = [];

/* =========================================================
   المسارات
========================================================= */

const lanes = [
    -3.2,
    0,
    3.2
];

let currentLane = 1;

let targetX = 0;

/* =========================================================
   اللعبة
========================================================= */

let playing = false;

let score = 0;

let coinCount = 0;

let speed = 12;

let jumpY = 0;

let jumpVelocity = 0;

let spawnTimer = 0;

let coinTimer = 0;

let gameClock = 0;

const DAY_LENGTH = 300;

/* =========================================================
   الوقت
========================================================= */

function updateTime(dt){

    gameClock += dt;

    if(gameClock >= DAY_LENGTH)
        gameClock = 0;

    const p =
        gameClock / DAY_LENGTH;

    const angle =
        p * Math.PI * 2;

    const daylight =
        Math.max(
            0,
            Math.sin(angle)
        );

    const red =
        0.15 +
        daylight * .85;

    const green =
        0.20 +
        daylight * .75;

    const blue =
        0.25 +
        daylight * .65;

    const color =
        new THREE.Color(
            red,
            green,
            blue
        );

    scene.background = color;

    scene.fog.color =
        color;

    sun.intensity =
        .25 +
        daylight * 1.8;

    ambient.intensity =
        .35 +
        daylight * 1.4;

    let name;

    if(p < .20)
        name = "🌅 فجر";
    else if(p < .50)
        name = "☀️ نهار";
    else if(p < .70)
        name = "🌇 غروب";
    else
        name = "🌙 ليل";

    clockElement.textContent =
        name;

    timeProgress.style.width =
        (p*100) + "%";

}

/* =========================================================
   إنشاء كلب
========================================================= */

function spawnDog(){

    const dog =
        createDog();

    const lane =
        Math.floor(
            Math.random()*3
        );

    dog.position.set(
        lanes[lane],
        0,
        -90
    );

    dog.userData.type =
        "dog";

    dog.userData.lane =
        lane;

    scene.add(dog);

    obstacles.push(dog);

}

/* =========================================================
   إنشاء قطة
========================================================= */

function spawnCat(){

    const cat =
        createCat();

    const lane =
        Math.floor(
            Math.random()*3
        );

    cat.position.set(
        lanes[lane],
        0,
        -100
    );

    cat.userData.type =
        "cat";

    cat.userData.lane =
        lane;

    scene.add(cat);

    obstacles.push(cat);

}

/* =========================================================
   إنشاء عملة
========================================================= */

function spawnCoin(){

    const coin =
        createCoin();

    const lane =
        Math.floor(
            Math.random()*3
        );

    coin.position.set(
        lanes[lane],
        0,
        -80
    );

    coin.userData.lane =
        lane;

    scene.add(coin);

    coins.push(coin);

}

/* =========================================================
   التحكم السريع
========================================================= */

function left(){

    if(!playing)
        return;

    currentLane--;

    if(currentLane<0)
        currentLane=0;

    targetX =
        lanes[currentLane];

}

function right(){

    if(!playing)
        return;

    currentLane++;

    if(currentLane>2)
        currentLane=2;

    targetX =
        lanes[currentLane];

}

function jump(){

    if(!playing)
        return;

    if(jumpY <= 0){

        jumpVelocity =
            11;

    }

}

/* =========================================================
   أزرار الهاتف
========================================================= */

document
.getElementById("left")
.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        left();
    },
    {passive:false}
);

document
.getElementById("right")
.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        right();
    },
    {passive:false}
);

document
.getElementById("jump")
.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        jump();
    },
    {passive:false}
);

/* =========================================================
   السحب السريع
========================================================= */

let touchX = 0;
let touchY = 0;

renderer.domElement
.addEventListener(
    "touchstart",
    e=>{

        const t =
            e.changedTouches[0];

        touchX = t.clientX;
        touchY = t.clientY;

    },
    {passive:true}
);

renderer.domElement
.addEventListener(
    "touchend",
    e=>{

        if(!playing)
            return;

        const t =
            e.changedTouches[0];

        const dx =
            t.clientX - touchX;

        const dy =
            t.clientY - touchY;

        if(
            Math.abs(dx)<20 &&
            Math.abs(dy)<20
        )
            return;

        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            if(dx>0)
                right();
            else
                left();

        }
        else{

            if(dy<0)
                jump();

        }

    },
    {passive:true}
);

/* =========================================================
   لوحة المفاتيح
========================================================= */

window.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowLeft")
            left();

        if(e.key==="ArrowRight")
            right();

        if(
            e.key==="ArrowUp" ||
            e.key===" "
        )
            jump();

    }
);

/* =========================================================
   الصوت
========================================================= */

let audioContext = null;

let soundEnabled = true;

function initAudio(){

    if(audioContext)
        return;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

}

function beep(
    frequency,
    duration,
    volume=.08
){

    if(!soundEnabled)
        return;

    initAudio();

    if(
        audioContext.state ===
        "suspended"
    )
        audioContext.resume();

    const oscillator =
        audioContext
        .createOscillator();

    const gain =
        audioContext
        .createGain();

    oscillator.frequency.value =
        frequency;

    oscillator.type =
        "sine";

    gain.gain.value =
        volume;

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}

/* صوت جمع العملة */

function coinSound(){

    beep(880,.08,.09);

    setTimeout(
        ()=>beep(1320,.10,.07),
        70
    );

}

/* صوت القفز */

function jumpSound(){

    beep(500,.12,.05);

}

/* صوت Game Over */

function gameOverSound(){

    beep(150,.4,.12);

}

/* تشغيل/إيقاف الصوت */

soundButton.addEventListener(
    "click",
    ()=>{

        soundEnabled =
            !soundEnabled;

        soundButton.textContent =
            soundEnabled ?
            "🔊" :
            "🔇";

    }
);

/* =========================================================
   الاصطدام
========================================================= */

function checkCollision(){

    const playerBox =
        new THREE.Box3()
        .setFromObject(player);

    for(let i=obstacles.length-1;i>=0;i--){

        const object =
            obstacles[i];

        const box =
            new THREE.Box3()
            .setFromObject(object);

        if(
            playerBox.intersectsBox(box)
        ){

            if(
                jumpY < .7 &&
                object.position.z > -3 &&
                object.position.z < 2
            ){

                endGame();

                return;

            }

        }

    }

}

/* =========================================================
   جمع العملات
========================================================= */

function collectCoins(){

    const playerBox =
        new THREE.Box3()
        .setFromObject(player);

    for(let i=coins.length-1;i>=0;i--){

        const coin =
            coins[i];

        const box =
            new THREE.Box3()
            .setFromObject(coin);

        if(
            playerBox.intersectsBox(box)
        ){

            coinCount++;

            score += 10;

            coinSound();

            scene.remove(coin);

            coins.splice(i,1);

        }

    }

}

/* =========================================================
   Game Over
========================================================= */

function endGame(){

    playing=false;

    gameOverSound();

    finalText.innerHTML =
        "النقاط: " +
        Math.floor(score) +
        "<br>🪙 العملات: " +
        coinCount;

    gameOverScreen.style.display =
        "flex";

}

/* =========================================================
   بداية اللعبة
========================================================= */

function resetGame(){

    obstacles.forEach(
        o=>scene.remove(o)
    );

    coins.forEach(
        c=>scene.remove(c)
    );

    obstacles.length=0;
    coins.length=0;

    currentLane=1;

    targetX=0;

    player.position.set(
        0,
        0,
        0
    );

    score=0;

    coinCount=0;

    speed=12;

    jumpY=0;

    jumpVelocity=0;

    spawnTimer=0;

    coinTimer=0;

    gameClock=0;

    scoreElement.textContent =
        "النقاط: 0";

    coinsElement.textContent =
        "🪙 0";

}

function startGame(){

    initAudio();

    resetGame();

    playing=true;

    startScreen.style.display =
        "none";

    gameOverScreen.style.display =
        "none";

}

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("restartButton")
.addEventListener(
    "click",
    startGame
);

/* =========================================================
   حلقة اللعبة
========================================================= */

let previousTime =
    performance.now();

function animate(now){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            (now-previousTime)/1000,
            .05
        );

    previousTime=now;

    if(playing){

        /* حركة اللاعب */

        player.position.x +=
            (
                targetX -
                player.position.x
            ) *
            Math.min(
                1,
                20*dt
            );

        /* قفز */

        if(
            jumpVelocity !== 0 ||
            jumpY > 0
        ){

            jumpY +=
                jumpVelocity*dt;

            jumpVelocity -=
                27*dt;

            if(jumpY <= 0){

                jumpY=0;
                jumpVelocity=0;

            }

        }

        player.position.y =
            jumpY;

        /* تحريك الأرجل */

        const run =
            Math.sin(
                now*.02
            )*.45;

        leftLeg.rotation.x =
            run;

        rightLeg.rotation.x =
            -run;

        /* الكاميرا */

        camera.position.x +=
            (
                player.position.x -
                camera.position.x
            ) *
            Math.min(
                1,
                8*dt
            );

        camera.position.y =
            4.3 + jumpY*.3;

        camera.lookAt(
            player.position.x,
            1,
            -10
        );

        /* زيادة السرعة */

        speed +=
            .35*dt;

        /* إنشاء الحيوانات */

        spawnTimer += dt;

        if(
            spawnTimer >
            Math.max(
                .65,
                1.8 -
                speed*.035
            )
        ){

            if(
                Math.random()<.65
            )
                spawnDog();
            else
                spawnCat();

            spawnTimer=0;

        }

        /* العملات */

        coinTimer += dt;

        if(
            coinTimer > .75
        ){

            spawnCoin();

            coinTimer=0;

        }

        /* تحريك العوائق */

        for(
            let i=obstacles.length-1;
            i>=0;
            i--
        ){

            const o =
                obstacles[i];

            o.position.z +=
                speed*dt;

            if(
                o.userData.type==="dog"
            ){

                o.position.y =
                    Math.abs(
                        Math.sin(
                            now*.015
                        )
                    )*.05;

            }

            if(
                o.position.z > 15
            ){

                scene.remove(o);

                obstacles.splice(i,1);

            }

        }

        /* تحريك العملات */

        for(
            let i=coins.length-1;
            i>=0;
            i--
        ){

            const c =
                coins[i];

            c.position.z +=
                speed*dt;

            c.rotation.y +=
                dt*5;

            if(
                c.position.z > 15
            ){

                scene.remove(c);

                coins.splice(i,1);

            }

        }

        score +=
            speed*dt*.4;

        scoreElement.textContent =
            "النقاط: " +
            Math.floor(score);

        coinsElement.textContent =
            "🪙 " +
            coinCount;

        updateTime(dt);

        checkCollision();

        collectCoins();

    }

    renderer.render(
        scene,
        camera
    );

}

requestAnimationFrame(
    animate
);

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

loading.style.display =
    "none";

</script>

</body>
    </html>
