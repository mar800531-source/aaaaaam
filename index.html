<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الكلمات الأسطوري - عمار بن ياسر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --primary-color: #10b981;
            --bg-color: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            --container-bg: rgba(255, 255, 255, 0.08);
            --text-color: #fff;
            --accent-color: #34d399;
            
            --fs-xl: clamp(22px, 5.5vw, 34px);
            --fs-l: clamp(20px, 4.5vw, 28px);
            --fs-m: clamp(17px, 4vw, 22px);
            --fs-s: clamp(14px, 3vw, 17px);
            
            --btn-size: clamp(48px, 13vw, 70px);
            --slot-size: clamp(42px, 12vw, 60px);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), #059669);
            filter: blur(150px);
            opacity: 0.3;
            z-index: 0;
        }

        /* علامات مائية صغيرة ومتعددة وغير مزعجة */
        .watermark-tiny {
            position: absolute;
            font-size: 2.2vw;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
        }
        .wt-1 { top: 8%; left: 12%; transform: rotate(-12deg); }
        .wt-2 { top: 15%; right: 10%; transform: rotate(15deg); }
        .wt-3 { top: 75%; left: 8%; transform: rotate(10deg); }
        .wt-4 { top: 85%; right: 15%; transform: rotate(-10deg); }
        .wt-5 { top: 45%; left: 4%; transform: rotate(-25deg); }
        .wt-6 { top: 35%; right: 6%; transform: rotate(20deg); }

        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4.5vw 5vw;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            width: 96vw;
            max-width: 550px;
            max-height: 96vh;
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        /* اسم عمار بن ياسر البارز في رأس الشاشة */
        .header-brand {
            background: linear-gradient(135deg, #34d399, #6ee7b7, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: var(--fs-xl);
            font-weight: 900;
            margin-bottom: 0.5vh;
            text-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
        }

        /* نقاط تتبع المراحل */
        .progress-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.5vh;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #34d399;
            transform: scale(1.3);
            box-shadow: 0 0 10px #34d399;
        }

        .dot.completed {
            background: #059669;
        }

        .main-title {
            font-size: var(--fs-l);
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.3vh;
        }

        .sub-title {
            color: #94a3b8;
            font-size: var(--fs-s);
            margin-bottom: 1.8vh;
        }

        .clue-box {
            font-size: var(--fs-m);
            margin-bottom: 2vh;
            color: #f8fafc;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5vh 4vw;
            border-radius: 15px;
            border-right: 5px solid #10b981;
            text-align: right;
        }

        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 2.2vw;
            margin-bottom: 2.2vh;
            min-height: 6.5vh;
            flex-wrap: wrap;
        }

        .slot {
            width: var(--slot-size);
            height: var(--slot-size);
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--fs-l);
            font-weight: bold;
            color: #34d399;
            cursor: pointer;
        }

        .slot.filled {
            border: 2px solid #34d399;
            background: rgba(16, 185, 129, 0.3);
        }

        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3vw;
            margin-bottom: 2.2vh;
        }

        .letter-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            flex-basis: calc(18% - 3vw);
            max-width: 65px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            font-size: var(--fs-l);
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.5);
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-btn:active {
            transform: scale(0.9);
        }

        .letter-btn.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 3.5vw;
            margin-top: auto;
            padding-top: 0.8vh;
        }

        .action-btn {
            flex: 1;
            padding: 1.5vh;
            border: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: var(--fs-m);
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .btn-submit {
            background: #10b981;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .message {
            font-size: var(--fs-m);
            margin-top: 0.8vh;
            font-weight: bold;
            min-height: 2.5vh;
        }

        .footer {
            margin-top: 1.2vh;
            font-size: 3.2vw;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 0.8vh;
        }
        .footer strong {
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    
    <!-- علامات مائية صغيرة ومتعددة -->
    <div class="watermark-tiny wt-1">عمار بن ياسر</div>
    <div class="watermark-tiny wt-2">عمار أصلاوي</div>
    <div class="watermark-tiny wt-3">تحدي الكلمات</div>
    <div class="watermark-tiny wt-4">عمار بن ياسر</div>
    <div class="watermark-tiny wt-5">⭐ أسطورة</div>
    <div class="watermark-tiny wt-6">عمار أصلاوي</div>

    <div class="game-container">
        <!-- اسم عمار بن ياسر البارز في رأس الشاشة -->
        <div class="header-brand">عمار بن ياسر</div>

        <!-- نقاط تتبع المراحل الـ 5 -->
        <div class="progress-dots" id="progressDots"></div>

        <div class="main-title">تحدي الكلمات</div>
        <div class="sub-title">فكر، اجمع الحروف، وحل اللغز</div>

        <div class="clue-box" id="clueText">جاري تحميل اللغز...</div>

        <div class="answer-slots" id="answerSlots"></div>
        <div class="letters-grid" id="lettersGrid"></div>

        <div class="controls">
            <button class="action-btn btn-clear" onclick="playClickSound(); clearSelection();">مسح 🔄</button>
            <button class="action-btn btn-submit" onclick="playClickSound(); checkWord();">تحقق ✅</button>
        </div>

        <div class="message" id="messageText"></div>

        <div class="footer">
            تصميم وتطوير: <strong>عمار أصلاوي</strong>
        </div>
    </div>

    <script>
        // نظام الصوت التفاعلي باستخدام Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'error') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        function playClickSound() { playSound('click'); }

        const levels = [
            { clue: "حيوان يُسمى سفينة الصحراء؟", word: "جمل", scrambled: "لمج" },
            { clue: "عاصمة دولة اليابان؟", word: "طوكيو", scrambled: "يوتكو" },
            { clue: "أكبر كوكب في المجموعة الشمسية؟", word: "المشتري", scrambled: "ريتمشال" },
            { clue: "عنصر كيميائي رمزه O؟", word: "أكسجين", scrambled: "نيجكسأ" },
            { clue: "جهاز ألعاب من شركة سوني؟", word: "بلايستيشن", scrambled: "يشيلاستيبن" }
        ];

        let currentLevel = parseInt(localStorage.getItem("mesh_level")) || 0;
        let selectedLetters = [];

        function renderDots() {
            const dotsContainer = document.getElementById("progressDots");
            if (!dotsContainer) return;
            dotsContainer.innerHTML = "";
            for (let i = 0; i < levels.length; i++) {
                const dot = document.createElement("div");
                dot.className = "dot";
                if (i < currentLevel) {
                    dot.classList.add("completed");
                } else if (i === currentLevel) {
                    dot.classList.add("active");
                }
                dotsContainer.appendChild(dot);
            }
        }

        function initLevel() {
            renderDots();
            if (currentLevel >= levels.length) {
                document.querySelector(".game-container").innerHTML = `
                    <div class="header-brand" style="font-size: 6.5vw; margin-bottom: 1vh;">عمار بن ياسر</div>
                    <h1 style="color:#34d399; font-size:5.5vw; margin:1.5vh 0;">🏆 أسطورة الكلمات!</h1>
                    <p style="color:#cbd5e1; font-size:4vw; margin-bottom:2.5vh;">أتممت جميع مراحل تحدي الكلمات بنجاح!</p>
                    <button class="action-btn btn-submit" onclick="playSound('click'); resetGame();" style="width:100%; padding:1.8vh;">إعادة اللعب من جديد 🔄</button>
                    <div class="footer" style="margin-top:2.5vh;">تصميم وتطوير: <strong>عمار أصلاوي</strong></div>
                `;
                return;
            }

            const data = levels[currentLevel];
            document.getElementById("clueText").innerText = `لغز (${currentLevel + 1}/${levels.length}): ${data.clue}`;
            selectedLetters = [];
            document.getElementById("messageText").innerText = "";

            renderSlots();
            renderLetters();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById("answerSlots");
            slotsContainer.innerHTML = "";
            const wordLength = levels[currentLevel].word.length;

            for (let i = 0; i < wordLength; i++) {
                const slot = document.createElement("div");
                slot.className = "slot" + (selectedLetters[i] ? " filled" : "");
                slot.innerText = selectedLetters[i] || "";
                
                slot.onclick = () => {
                    if(selectedLetters[i]) {
                        playSound('click');
                        selectedLetters.splice(i, 1);
                        renderSlots();
                        renderLetters();
                    }
                };
                slotsContainer.appendChild(slot);
            }
        }

        function renderLetters() {
            const gridContainer = document.getElementById("lettersGrid");
            gridContainer.innerHTML = "";
            const scrambled = levels[currentLevel].scrambled;

            scrambled.split("").forEach((char) => {
                const btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = char;
                
                btn.onclick = () => {
                    playSound('click');
                    const wordLength = levels[currentLevel].word.length;
                    if (selectedLetters.length < wordLength) {
                        selectedLetters.push(char);
                        btn.classList.add('used');
                        renderSlots();
                    }
                };
                gridContainer.appendChild(btn);
            });
        }

        function clearSelection() {
            selectedLetters = [];
            document.querySelectorAll('.letter-btn').forEach(btn => {
                btn.classList.remove('used');
            });
            renderSlots();
        }

        function checkWord() {
            const data = levels[currentLevel];
            const formedWord = selectedLetters.join("");
            const msg = document.getElementById("messageText");

            if (formedWord === data.word) {
                playSound('success');
                msg.style.color = "#34d399";
                msg.innerText = "🎉 إجابة صحيحة!";
                currentLevel++;
                localStorage.setItem("mesh_level", currentLevel);
                setTimeout(initLevel, 1500);
            } else {
                playSound('error');
                msg.style.color = "#fca5a5";
                msg.innerText = "❌ خطأ، حاول مرة أخرى!";
                setTimeout(clearSelection, 800);
            }
        }

        function resetGame() {
            localStorage.removeItem("mesh_level");
            currentLevel = 0;
            location.reload();
        }

        initLevel();
    </script>
</body>
</html>
