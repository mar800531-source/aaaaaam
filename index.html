<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الكلمات الأسطوري - عمار بن ياسر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #10b981, #059669);
            filter: blur(140px);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.3;
        }

        /* رسومات وزخارف نجوم */
        .sparkle {
            position: absolute;
            color: rgba(52, 211, 153, 0.25);
            font-size: 20px;
            animation: pulseSparkle 3s infinite alternate;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes pulseSparkle {
            0% { transform: scale(0.8); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        /* علامات مائية متعددة موزعة في الخلفية بشكل غير مزعج */
        .watermark-multi {
            position: absolute;
            font-size: 14px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.035);
            pointer-events: none;
            z-index: 1;
            user-select: none;
        }

        .wm-1 { top: 8%; left: 12%; transform: rotate(-15deg); }
        .wm-2 { top: 15%; right: 10%; transform: rotate(10deg); }
        .wm-3 { bottom: 12%; left: 15%; transform: rotate(25deg); }
        .wm-4 { bottom: 18%; right: 12%; transform: rotate(-10deg); }
        .wm-5 { top: 50%; left: 5%; transform: rotate(-45deg); }
        .wm-6 { top: 45%; right: 6%; transform: rotate(35deg); }

        .game-container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 22px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 420px;
            width: 92%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #34d399, #6ee7b7, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .sub-title {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* رأس الصفحة (عداد النقاط وأزرار التحكم العليا) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 5px;
        }

        .score-badge {
            font-size: 12px;
            font-weight: bold;
            color: #fde047;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .tool-btn:hover {
            background: rgba(52, 211, 153, 0.3);
            border-color: #34d399;
        }

        /* عداد المراحل */
        .level-progress-bar {
            font-size: 13px;
            color: #34d399;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            border: 1px dashed rgba(52, 211, 153, 0.3);
        }

        /* صندوق اللغز الجذاب */
        .clue-box {
            font-size: 15px;
            margin-bottom: 15px;
            color: #f8fafc;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 12px;
            border-right: 4px solid #10b981;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* مربعات الإجابة */
        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 18px;
            min-height: 45px;
            flex-wrap: wrap;
        }

        .slot {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #34d399;
            cursor: pointer;
        }

        .slot.filled {
            border: 2px solid #34d399;
            background: rgba(16, 185, 129, 0.25);
            animation: popIn 0.2s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        /* شبكة الحروف المبعثرة */
        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .letter-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
            transition: all 0.2s ease;
        }

        .letter-btn:active {
            transform: scale(0.92);
        }

        /* أزرار التحكم السفلي */
        .controls {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-submit {
            background: #10b981;
            color: white;
        }

        .message {
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
            min-height: 20px;
        }

        /* نافذة خريطة التنقل المنبثقة */
        .map-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 44, 34, 0.95);
            backdrop-filter: blur(15px);
            z-index: 10;
            display: none;
            flex-direction: column;
            padding: 20px;
            border-radius: 28px;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .map-title {
            font-size: 18px;
            font-weight: bold;
            color: #34d399;
        }

        .close-map-btn {
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid #ef4444;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            overflow-y: auto;
            max-height: 320px;
            padding: 5px;
        }

        .map-level-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .map-level-btn.completed {
            background: rgba(16, 185, 129, 0.3);
            border-color: #34d399;
            color: #34d399;
        }

        .map-level-btn.current {
            background: #fde047;
            color: #000;
            border-color: #fde047;
        }

        .map-level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }
        .footer strong {
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- علامات مائية متعددة موزعة في الخلفية بشكل غير مزعج -->
    <div class="watermark-multi wm-1">عمار بن ياسر</div>
    <div class="watermark-multi wm-2">عمار أصلاوي</div>
    <div class="watermark-multi wm-3">تحدي العقول</div>
    <div class="watermark-multi wm-4">عمار بن ياسر</div>
    <div class="watermark-multi wm-5">⭐</div>
    <div class="watermark-multi wm-6">🧠</div>

    <!-- زخارف نجوم متحركة -->
    <div class="sparkle" style="top: 10%; right: 15%;">✨</div>
    <div class="sparkle" style="top: 25%; left: 10%; animation-delay: 1s;">⭐</div>
    <div class="sparkle" style="bottom: 15%; right: 20%; animation-delay: 2s;">🌟</div>

    <div class="game-container">
        <!-- نافذة خريطة التنقل الداخلية -->
        <div class="map-modal" id="mapModal">
            <div class="map-header">
                <div class="map-title">🗺️ خريطة المراحل (200 مرحلة)</div>
                <button class="close-map-btn" onclick="toggleMap(false)">إغلاق ✕</button>
            </div>
            <div class="map-grid" id="mapGridContainer"></div>
        </div>

        <div class="main-title">عمار بن ياسر 🧠</div>
        <div class="sub-title">تحدي الكلمات الأسطوري</div>

        <!-- رأس الصفحة: النقاط وزر المساعدة وزر الخريطة -->
        <div class="top-bar">
            <div class="score-badge" id="scoreDisplay">⭐ النقاط: 0</div>
            <button class="tool-btn" onclick="toggleMap(true)">🗺️ الخريطة</button>
            <button class="tool-btn" onclick="useHint()" title="كشف حرف بـ 5 نقاط">💡 مساعدة</button>
        </div>

        <!-- عداد المراحل -->
        <div class="level-progress-bar" id="levelProgressText">المرحلة 1 من 200</div>

        <div class="clue-box" id="clueText">جاري تحميل اللغز...</div>

        <!-- مربعات الإجابة -->
        <div class="answer-slots" id="answerSlots"></div>

        <!-- الحروف المبعثرة -->
        <div class="letters-grid" id="lettersGrid"></div>

        <div class="controls">
            <button class="action-btn btn-clear" onclick="clearSelection(); playSound('click');">مسح 🔄</button>
            <button class="action-btn btn-submit" onclick="checkWord()">تحقق ✅</button>
        </div>

        <div class="message" id="messageText"></div>

        <div class="footer">
            تصميم وتطوير: <strong>عمار أصلاوي</strong>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        const baseQuestions = [
            { clue: "حيوان يُسمى سفينة الصحراء؟", word: "جمل" },
            { clue: "عاصمة دولة اليابان؟", word: "طوكيو" },
            { clue: "أكبر كوكب في المجموعة الشمسية؟", word: "المشتري" },
            { clue: "عنصر كيميائي رمزه O؟", word: "أكسجين" },
            { clue: "سورة قرآنية تُسمى قلب القرآن؟", word: "يس" },
            { clue: "عاصمة مصر؟", word: "القاهرة" },
            { clue: "حيوان يُسمى ملك الأغنام؟", word: "الكبش" },
            { clue: "ما هو أسرع حيوان بري؟", word: "فهد" },
            { clue: "عاصمة السعودية؟", word: "الرياض" },
            { clue: "أطول نهر في العالم؟", word: "النيل" },
            { clue: "معدن ثمين لونه أصفر؟", word: "ذهب" },
            { clue: "عاصمة فرنسا؟", word: "باريس" },
            { clue: "ما هو غاز الحياة والتنفس؟", word: "أكسجين" },
            { clue: "أكبر محيط على وجه الأرض؟", word: "الهادئ" },
            { clue: "عاصمة الإمارات؟", word: "أبوظبي" },
            { clue: "حيوان يعيش في الماء وله صدفة قوية؟", word: "سحلفاة" },
            { clue: "ما هو الكوكب الأحمر؟", word: "المريخ" },
            { clue: "عاصمة الجزائر؟", word: "الجزائر" },
            { clue: "مخترع المصباح الكهربائي؟", word: "ديسون" },
            { clue: "عاصمة فلسطين الأبدية؟", word: "القدس" }
        ];

        const levels = [];
        for (let i = 0; i < 200; i++) {
            let base = baseQuestions[i % baseQuestions.length];
            let scrambled = base.word.split('').sort(() => Math.random() - 0.5).join('');
            if (scrambled === base.word && base.word.length > 1) {
                scrambled = base.word.split('').reverse().join('');
            }
            levels.push({
                clue: `[مرحلة ${i + 1}] ${base.clue}`,
                word: base.word,
                scrambled: scrambled
            });
        }

        let currentLevel = parseInt(localStorage.getItem("mesh_level")) || 0;
        let maxUnlockedLevel = parseInt(localStorage.getItem("mesh_max_unlocked")) || currentLevel;
        let score = parseInt(localStorage.getItem("mesh_score")) || 30;
        let selectedLetters = [];

        function updateScore(amount) {
            score += amount;
            if (score < 0) score = 0;
            localStorage.setItem("mesh_score", score);
            document.getElementById("scoreDisplay").innerText = `⭐ النقاط: ${score}`;
        }

        function toggleMap(show) {
            playSound('click');
            const modal = document.getElementById("mapModal");
            if (show) {
                modal.style.display = "flex";
                renderMapGrid();
            } else {
                modal.style.display = "none";
            }
        }

        function renderMapGrid() {
            const container = document.getElementById("mapGridContainer");
            container.innerHTML = "";
            for (let i = 0; i < levels.length; i++) {
                const btn = document.createElement("button");
                btn.className = "map-level-btn";
                btn.innerText = i + 1;

                if (i === currentLevel) {
                    btn.classList.add("current");
                } else if (i <= maxUnlockedLevel) {
                    btn.classList.add("completed");
                    btn.onclick = () => {
                        currentLevel = i;
                        toggleMap(false);
                        initLevel();
                    };
                } else {
                    btn.classList.add("locked");
                    btn.title = "مرحلة مقفلة";
                }
                container.appendChild(btn);
            }
        }

        function initLevel() {
            updateScore(0);
            document.getElementById("levelProgressText").innerText = `المرحلة ${currentLevel + 1} من 200`;

            if (currentLevel >= levels.length) {
                document.querySelector(".game-container").innerHTML = `
                    <div class="main-title" style="font-size: 26px;">عمار بن ياسر 🏆</div>
                    <h1 style="color:#34d399; font-size:22px; margin:15px 0;">أنت الأسطورة الحقيقية!</h1>
                    <p style="color:#cbd5e1; font-size:15px; margin-bottom:15px;">أتممت جميع الـ 200 مرحلة بنجاح باهر!</p>
                    <div style="background: rgba(253,224,71,0.1); border:1px dashed #fde047; padding:10px; border-radius:10px; color:#fde047; margin-bottom:15px; font-weight:bold;">
                        مجموع نقاطك النهائية: ${score} ⭐
                    </div>
                    <button class="action-btn btn-submit" onclick="resetGame()" style="width:100%; padding:10px;">إعادة اللعب من جديد 🔄</button>
                    <div class="footer" style="margin-top: 20px;">تصميم وتطوير: <strong>عمار أصلاوي</strong></div>
                `;
                playSound('success');
                return;
            }

            const data = levels[currentLevel];
            document.getElementById("clueText").innerText = data.clue;
            selectedLetters = new Array(data.word.length).fill(null);
            document.getElementById("messageText").innerText = "";

            renderSlots();
            renderLetters();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById("answerSlots");
            slotsContainer.innerHTML = "";
            const targetWord = levels[currentLevel].word;

            for (let i = 0; i < targetWord.length; i++) {
                const slot = document.createElement("div");
                slot.className = "slot" + (selectedLetters[i] ? " filled" : "");
                slot.innerText = selectedLetters[i] || "";
                
                slot.onclick = () => {
                    if (selectedLetters[i]) {
                        selectedLetters[i] = null;
                        playSound('click');
                        renderSlots();
                    }
                };
                slotsContainer.appendChild(slot);
            }
        }

        function renderLetters() {
            const gridContainer = document.getElementById("lettersGrid");
            gridContainer.innerHTML = "";
            const scrambled = levels[currentLevel].scrambled;

            scrambled.split("").forEach((char) => {
                const btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = char;
                
                btn.onclick = () => {
                    const emptyIndex = selectedLetters.indexOf(null);
                    if (emptyIndex !== -1) {
                        selectedLetters[emptyIndex] = char;
                        playSound('click');
                        renderSlots();
                    }
                };
                gridContainer.appendChild(btn);
            });
        }

        function clearSelection() {
            selectedLetters = new Array(levels[currentLevel].word.length).fill(null);
            renderSlots();
        }

        function useHint() {
            if (score < 5) {
                playSound('error');
                alert("عذراً، لا توجد نقاط كافية لديك (تحتاج 5 نقاط على الأقل)!");
                return;
            }

            const targetWord = levels[currentLevel].word;
            for (let i = 0; i < targetWord.length; i++) {
                if (selectedLetters[i] !== targetWord[i]) {
                    selectedLetters[i] = targetWord[i];
                    updateScore(-5);
                    playSound('click');
                    renderSlots();
                    return;
                }
            }
        }

        function checkWord() {
            const targetWord = levels[currentLevel].word;
            const userWord = selectedLetters.join("");
            const msg = document.getElementById("messageText");

            if (userWord === targetWord) {
                msg.style.color = "#34d399";
                msg.innerText = "✨ إجابة صحيحة أسطورية! (+10 نقاط)";
                updateScore(10);
                playSound('success');
                currentLevel++;
                if (currentLevel > maxUnlockedLevel) {
                    maxUnlockedLevel = currentLevel;
                    localStorage.setItem("mesh_max_unlocked", maxUnlockedLevel);
                }
                localStorage.setItem("mesh_level", currentLevel);
                setTimeout(initLevel, 1200);
            } else {
                msg.style.color = "#f87171";
                msg.innerText = "❌ الحروف غير مرتبة بشكل صحيح!";
                playSound('error');
            }
        }

        function resetGame() {
            localStorage.clear();
            currentLevel = 0;
            maxUnlockedLevel = 0;
            score = 30;
            location.reload();
        }

        initLevel();
    </script>
</body>
</html>
