<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- هذا السطر هو الأهم لجعل الموقع متجاوباً على الهواتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الكلمات الأسطوري - عمار بن ياسر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --primary-color: #10b981;
            --bg-color: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            --container-bg: rgba(255, 255, 255, 0.06);
            --text-color: #fff;
            --accent-color: #34d399;
            
            /* وحدات قياس مرنة تتغير حسب حجم الشاشة */
            --fs-xl: clamp(20px, 5vw, 32px);
            --fs-l: clamp(18px, 4vw, 26px);
            --fs-m: clamp(16px, 3.5vw, 20px);
            --fs-s: clamp(13px, 3vw, 16px);
            
            --btn-size: clamp(40px, 12vw, 60px); /* الأزرار تصغر وتكبر */
            --slot-size: clamp(35px, 11vw, 50px); /* المربعات تصغر وتكبر */
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent; /* يزيل التحديد الأزرق عند الضغط */
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden; /* لمنع التمرير */
            position: fixed; /* لمنع الارتداد في iOS */
            width: 100%;
            height: 100%;
        }

        /* خلفية متحركة */
        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), #059669);
            filter: blur(150px);
            opacity: 0.3;
            z-index: 0;
        }

        /* علامات مائية مرنة */
        .watermark-multi {
            position: absolute;
            font-size: 4vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 1;
        }
        .wm-1 { top: 10%; left: 15%; transform: rotate(-15deg); }
        .wm-2 { top: 80%; right: 10%; transform: rotate(10deg); }
        .wm-3 { bottom: 10%; left: 18%; transform: rotate(20deg); }
        .wm-4 { top: 40%; right: 5%; }

        /* حاوية اللعبة الرئيسية (تأخذ 90% من عرض الشاشة) */
        .game-container {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 5vw; /* الحشو الداخلي يعتمد على حجم الشاشة */
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            width: 92vw;
            max-width: 450px; /* حد أقصى للعرض لتبقى الأزرار مريحة */
            max-height: 95vh; /* لمنع الخروج عن الشاشة طولياً */
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto; /* للسماح بالتمرير إذا كان المحتوى طويلاً */
        }

        .main-title {
            font-size: var(--fs-xl);
            font-weight: 900;
            background: linear-gradient(135deg, #34d399, #6ee7b7, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1vh;
        }

        .sub-title {
            color: #94a3b8;
            font-size: var(--fs-s);
            font-weight: 700;
            margin-bottom: 3vh;
        }

        .clue-box {
            font-size: var(--fs-m);
            margin-bottom: 3vh;
            color: #f8fafc;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.25);
            padding: 1.5vh 4vw;
            border-radius: 12px;
            border-right: 4px solid #10b981;
        }

        /* منطقة الإجابة */
        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 2vw; /* المسافة بين المربعات مرنة */
            margin-bottom: 3vh;
            min-height: 6vh;
            flex-wrap: wrap;
        }

        .slot {
            width: var(--slot-size);
            height: var(--slot-size);
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--fs-l);
            font-weight: bold;
            color: #34d399;
        }

        .slot.filled {
            border: 2px solid #34d399;
            background: rgba(16, 185, 129, 0.2);
        }

        /* لوحة الحروف المبعثرة */
        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 3vw; /* المسافة بين الأزرار مرنة */
            margin-bottom: 3vh;
        }

        .letter-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            flex-basis: calc(15% - 3vw); /* لجعل الأزرار تأخذ مساحة محددة وتلتف */
            max-width: 55px; /* حد أقصى لحجم الزر */
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            font-size: var(--fs-m);
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-btn:active {
            transform: scale(0.9);
        }

        .letter-btn.used {
            opacity: 0.3;
            pointer-events: none;
        }

        /* أزرار التحكم */
        .controls {
            display: flex;
            gap: 4vw;
            margin-top: auto; /* لدفع الأزرار للأسفل */
            padding-top: 1vh;
        }

        .action-btn {
            flex: 1;
            padding: 1.5vh;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: var(--fs-s);
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-submit {
            background: #10b981;
            color: white;
        }

        .message {
            font-size: var(--fs-s);
            margin-top: 1vh;
            font-weight: bold;
            min-height: 3vh;
        }

        .footer {
            margin-top: 2vh;
            font-size: 3vw; /* حجم خط صغير جداً */
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1vh;
        }
        .footer strong {
            color: #34d399;
        }
        
        /* تعديل خاص للشاشات الصغيرة جداً (مثل iPhone SE القديم) */
        @media (max-height: 500px) {
            .game-container { padding: 3vw; }
            .main-title { margin-bottom: 0.5vh; }
            .sub-title { margin-bottom: 1vh; }
            .clue-box { margin-bottom: 1vh; padding: 1vh 3vw; }
            .answer-slots { margin-bottom: 1vh; }
            .letters-grid { margin-bottom: 1vh; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="watermark-multi wm-1">عمار بن ياسر</div>
    <div class="watermark-multi wm-2">عمار أصلاوي</div>
    <div class="watermark-multi wm-3">⭐</div>
    <div class="watermark-multi wm-4">🧠</div>

    <div class="game-container">
        <div class="main-title">تحدي الكلمات</div>
        <div class="sub-title">فكر، اجمع الحروف، وحل اللغز</div>

        <div class="clue-box" id="clueText">جاري تحميل اللغز...</div>

        <div class="answer-slots" id="answerSlots"></div>
        <div class="letters-grid" id="lettersGrid"></div>

        <div class="controls">
            <button class="action-btn btn-clear" onclick="clearSelection()">مسح 🔄</button>
            <button class="action-btn btn-submit" onclick="checkWord()">تحقق ✅</button>
        </div>

        <div class="message" id="messageText"></div>

        <div class="footer">
            تصميم وتطوير: <strong>عمار أصلاوي</strong>
        </div>
    </div>

    <script>
        // مصفوفة المراحل (تم إضافة كلمة أطول للتجربة)
        const levels = [
            { clue: "حيوان يُسمى سفينة الصحراء؟", word: "جمل", scrambled: "لمج" },
            { clue: "عاصمة دولة اليابان؟", word: "طوكيو", scrambled: "يوتكو" },
            { clue: "أكبر كوكب في المجموعة الشمسية؟", word: "المشتري", scrambled: "ريتمشال" },
            { clue: "عنصر كيميائي رمزه O؟", word: "أكسجين", scrambled: "نيجكسأ" },
            { clue: "جهاز ألعاب من شركة سوني؟", word: "بلايستيشن", scrambled: "يشيلاستيبن" }
        ];

        let currentLevel = parseInt(localStorage.getItem("mesh_level")) || 0;
        let selectedLetters = [];

        function initLevel() {
            if (currentLevel >= levels.length) {
                document.querySelector(".game-container").innerHTML = `
                    <div class="main-title" style="font-size: 8vw;">عمار بن ياسر</div>
                    <h1 style="color:#34d399; font-size:6vw; margin:2vh 0;">🏆 أسطورة الكلمات!</h1>
                    <p style="color:#cbd5e1; font-size:4vw; margin-bottom:3vh;">أتممت جميع مراحل تحدي الكلمات بنجاح!</p>
                    <button class="action-btn btn-submit" onclick="resetGame()" style="width:100%; padding:2vh;">إعادة اللعب من جديد 🔄</button>
                    <div class="footer" style="margin-top:3vh;">تصميم وتطوير: <strong>عمار أصلاوي</strong></div>
                `;
                return;
            }

            const data = levels[currentLevel];
            document.getElementById("clueText").innerText = `لغز (${currentLevel + 1}/${levels.length}): ${data.clue}`;
            selectedLetters = [];
            document.getElementById("messageText").innerText = "";

            renderSlots();
            renderLetters();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById("answerSlots");
            slotsContainer.innerHTML = "";
            const wordLength = levels[currentLevel].word.length;

            for (let i = 0; i < wordLength; i++) {
                const slot = document.createElement("div");
                slot.className = "slot" + (selectedLetters[i] ? " filled" : "");
                slot.innerText = selectedLetters[i] || "";
                
                // النقر على الخانة لإلغاء الحرف
                slot.onclick = () => {
                    if(selectedLetters[i]) {
                        selectedLetters.splice(i, 1);
                        renderSlots();
                        renderLetters();
                    }
                };
                slotsContainer.appendChild(slot);
            }
        }

        function renderLetters() {
            const gridContainer = document.getElementById("lettersGrid");
            gridContainer.innerHTML = "";
            const scrambled = levels[currentLevel].scrambled;
            const wordLength = levels[currentLevel].word.length;

            scrambled.split("").forEach((char, index) => {
                const btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = char;
                
                // حساب كم مرة تم استخدام هذا الحرف في الإجابة
                const usedCount = selectedLetters
